name: Build check (apex — NO auto-deploy)

# IMPORTANT: the apex site is NOT git-based deployable.
# public/wp-content/uploads/ is ~1.2 GB of media that is gitignored
# (see .gitignore). A CI build runs from the git checkout, which does NOT
# contain that media, so `wrangler pages deploy out` from CI ships an
# image-less build and ~93% of the site's images 404. This actually happened
# (2026-06-03 deploys) and broke the live apex.
#
# Until the media is moved to R2 / Git LFS / a fetchable artifact, the apex
# is DEPLOY-BY-MANUAL-WRANGLER ONLY:
#   cd ~/Documents/parent && npm run build && unset CLOUDFLARE_API_TOKEN && \
#     npx wrangler pages deploy out --project-name=babulashotsrd --branch=main --commit-dirty=true
#
# This workflow only verifies the build compiles. It does NOT deploy.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
